name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GameLauncher.slnx

      - name: Build
        run: dotnet build GameLauncher.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --project tests/GameLauncher.Core.Tests/GameLauncher.Core.Tests.csproj -c Release --no-build

      - name: Publish
        run: dotnet publish src/GameLauncher.App/GameLauncher.App.csproj -c Release -r win-x64 -o artifacts/GameLauncher

      - name: Publish size
        shell: pwsh
        run: |
          $files = Get-ChildItem artifacts/GameLauncher -Recurse -File
          $mb = [math]::Round(($files | Measure-Object Length -Sum).Sum / 1MB, 1)
          "Publish: $($files.Count) files, $mb MB uncompressed" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # upload-artifact сам упаковывает папку в zip — без zip внутри zip.
      # Артефакт нужен только для проверки сборки PR — храним недолго.
      - uses: actions/upload-artifact@v7
        with:
          name: GameLauncher-win-x64
          path: artifacts/GameLauncher/
          if-no-files-found: error
          retention-days: 7
