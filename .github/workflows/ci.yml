name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GameLauncher.slnx

      - name: Build
        run: dotnet build GameLauncher.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --project tests/GameLauncher.Core.Tests/GameLauncher.Core.Tests.csproj -c Release --no-build

      - name: Publish
        run: dotnet publish src/GameLauncher.App/GameLauncher.App.csproj -c Release -r win-x64 -o artifacts/GameLauncher

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path artifacts/GameLauncher/* -DestinationPath artifacts/GameLauncher-win-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: GameLauncher-win-x64
          path: artifacts/GameLauncher-win-x64.zip
          if-no-files-found: error
