name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          # Кэш пакетов NuGet; ключ меняется вместе с версиями пакетов.
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore GameLauncher.slnx

      - name: Build
        run: dotnet build GameLauncher.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --project tests/GameLauncher.Core.Tests/GameLauncher.Core.Tests.csproj -c Release --no-build

      - name: Publish
        run: dotnet publish src/GameLauncher.App/GameLauncher.App.csproj -c Release -r win-x64 -o artifacts/GameLauncher

      - name: Publish size
        shell: pwsh
        run: |
          $files = Get-ChildItem artifacts/GameLauncher -Recurse -File
          $mb = [math]::Round(($files | Measure-Object Length -Sum).Sum / 1MB, 1)
          "Publish: $($files.Count) files, $mb MB uncompressed" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # Смоук-тест: приложение должно запуститься и не упасть за 20 секунд.
      - name: Smoke launch
        shell: pwsh
        run: |
          Get-ChildItem artifacts/GameLauncher -File | Where-Object { $_.Extension -in '.exe','.pri','.xbf' -or $_.Name -like 'Microsoft.WindowsAppRuntime*' -or $_.Name -like 'Microsoft.ui.xaml*' } | Format-Table Name, Length -AutoSize | Out-String | Write-Host
          $langDirs = Get-ChildItem artifacts/GameLauncher -Directory | Where-Object { $_.Name -match '^[a-z]{2,3}(-[A-Za-z]+)+$' } | ForEach-Object Name
          Write-Host "Language folders: $($langDirs -join ', ')"
          $start = Get-Date
          $p = Start-Process -FilePath artifacts/GameLauncher/GameLauncher.exe -PassThru
          $exited = $p.WaitForExit(20000)
          if ($exited) {
            Write-Host ("Process exited, code 0x{0:X8}" -f $p.ExitCode)
          } else {
            $p.Refresh()
            Write-Host "Process alive after 20s, MainWindowHandle=$($p.MainWindowHandle), title='$($p.MainWindowTitle)'"

            # Второй запуск должен передать активацию первому и сразу завершиться (один экземпляр).
            $second = Start-Process -FilePath artifacts/GameLauncher/GameLauncher.exe -PassThru
            if (-not $second.WaitForExit(15000)) {
              Stop-Process -Id $second.Id -Force
              Stop-Process -Id $p.Id -Force
              Write-Error "Второй экземпляр не завершился за 15 с"
              exit 1
            }
            Write-Host ("Second instance exited, code 0x{0:X8}" -f $second.ExitCode)
            $p.Refresh()
            if ($p.HasExited) {
              Write-Error "Первый экземпляр закрылся после запуска второго"
              exit 1
            }
            Stop-Process -Id $p.Id -Force
          }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $start } -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in 'Application Error', '.NET Runtime', 'Windows Error Reporting', 'SideBySide' } |
            ForEach-Object { Write-Host "---- $($_.ProviderName) [$($_.Id)]"; Write-Host $_.Message }
          if ($exited) { exit 1 }

      # upload-artifact сам упаковывает папку в zip — без zip внутри zip.
      # Артефакт нужен только для проверки сборки PR — храним недолго.
      - uses: actions/upload-artifact@v7
        with:
          name: GameLauncher-win-x64
          path: artifacts/GameLauncher/
          if-no-files-found: error
          retention-days: 7
