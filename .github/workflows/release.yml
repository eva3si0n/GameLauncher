name: Release

# Выпуск версии → сборка, тесты, смоук-запуск → GitHub Release с zip. Два способа запуска:
# - push тега вида v1.2.3;
# - вручную (Actions → Release → Run workflow) с версией 1.2.3: тег создаётся на выбранном коммите вместе с релизом.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без «v», например 1.0.0'
        required: true

permissions:
  contents: write # создание релиза

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { $env:INPUT_VERSION.Trim().TrimStart('v') } else { '${{ github.ref_name }}'.TrimStart('v') }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Версия '$version' должна иметь вид 1.2.3"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test --project tests/GameLauncher.Core.Tests/GameLauncher.Core.Tests.csproj -c Release

      - name: Publish
        run: dotnet publish src/GameLauncher.App/GameLauncher.App.csproj -c Release -r win-x64 -p:Version=${{ steps.version.outputs.version }} -o artifacts/GameLauncher

      # Не выпускаем сборку, которая падает при старте.
      - name: Smoke launch
        shell: pwsh
        run: |
          $p = Start-Process -FilePath artifacts/GameLauncher/GameLauncher.exe -PassThru
          if ($p.WaitForExit(20000)) {
            Write-Error ("Приложение завершилось при старте, код 0x{0:X8}" -f $p.ExitCode)
            exit 1
          }
          Stop-Process -Id $p.Id -Force

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path artifacts/GameLauncher/* -DestinationPath "artifacts/GameLauncher-${{ steps.version.outputs.version }}-win-x64.zip"

      # При push тега он уже есть; при ручном запуске gh создаст тег на текущем коммите.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.version.outputs.tag }}"
          "artifacts/GameLauncher-${{ steps.version.outputs.version }}-win-x64.zip"
          --title "GameLauncher ${{ steps.version.outputs.version }}"
          --target "${{ github.sha }}"
          --generate-notes
